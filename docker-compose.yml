# Reproducibility fallback ONLY — a clean-room Postgres for anyone who doesn't
# want to install it natively. Daily development does NOT use this (Docker
# Desktop alone can eat ~2GB, which the 8GB M1 Air can't spare); it runs
# native Postgres instead. See docs/ARCHITECTURE.md §8.
#
#   docker compose up -d db      # start just Postgres
#   docker compose down          # stop it
#
# Point your .env at it with:
#   DATABASE_URL=postgresql+psycopg2://postgres:berthiq@localhost:5432/berthiq

services:
  db:
    image: postgres:15
    container_name: berthiq-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: berthiq
      POSTGRES_DB: berthiq
    ports:
      - "5432:5432"
    volumes:
      - berthiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d berthiq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  berthiq_pgdata:
