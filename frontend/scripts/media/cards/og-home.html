<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="brand.css" />
<style>
  .copy { position: absolute; left: 64px; top: 52px; width: 500px; }
  .copy .eyebrow { margin-top: 64px; }
  .copy h1 { margin-top: 20px; font-size: 90px; }
  .copy .sub { margin-top: 22px; font-size: 20px; width: 470px; }
  .footline { position: absolute; left: 64px; bottom: 30px; }
  .harbor { left: 584px; top: 26px; width: 566px; --ratio: 1122 / 720; --w: 151.5%; --x: -28%; --y: -6.5%; transform: rotate(-3deg); }
  .verdict { left: 630px; top: 388px; width: 530px; --ratio: 1327 / 356; --w: 161%; transform: rotate(2deg); }
  .risk { left: 660px; top: 540px; padding: 11px 16px; transform: rotate(-1.5deg); }
</style>
</head>
<body>
<main class="canvas">
  <div class="copy">
    <span class="brand" data-fit>
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 3.5v25" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M9.5 5h17.5v13H9.5z" fill="#f2c230"/><path d="M5 28.5h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Berth<b>IQ</b></span>
    </span>
    <div><span class="eyebrow" data-fit>Port-call decision support</span></div>
    <h1 data-fit>Why is this<br />ship <em>waiting?</em></h1>
    <p class="sub" data-fit>Replay a week at Khalifa Port, see what held each ship, and test a fix before the port changes anything.</p>
  </div>
  <figure class="shot window harbor"><img src="crops/harbor.webp" alt="" /></figure>
  <figure class="shot window verdict"><img src="crops/verdict.webp" alt="" /></figure>
  <div class="chip risk" data-fit><strong>17 of 26</strong><span>open calls<br />at risk</span><span class="pill predicted"><i></i>Predicted</span></div>
  <p class="footline" data-fit>Synthetic operations on real port geography · map © OpenStreetMap</p>
</main>
</body>
</html>
