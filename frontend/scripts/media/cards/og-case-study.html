<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="brand.css" />
<style>
  .copy { position: absolute; left: 64px; top: 52px; width: 560px; }
  .case { display: inline-block; margin-top: 40px; padding: 8px 16px; border-radius: 999px; background: var(--signal); color: #10161c; font: 600 15px/1 var(--mono); letter-spacing: 0.14em; }
  .copy h1 { margin-top: 20px; font-size: 70px; }
  .stats { display: flex; gap: 40px; margin-top: 28px; }
  .stats strong { display: block; font: 800 50px/0.9 var(--display); color: var(--signal); }
  .stats strong.sim { color: var(--teal); }
  .stats span { display: block; margin-top: 6px; font: 500 16px/1.25 var(--sans); color: var(--soft); }
  .byline { margin-top: 26px; font: 500 17px/1.3 var(--sans); color: var(--ink); }
  .footline { position: absolute; left: 64px; bottom: 28px; }
  .harbor { left: 700px; top: 40px; width: 470px; --ratio: 1360 / 600; --w: 125%; --x: -12.5%; --y: -33%; transform: rotate(5deg); }
  .why { left: 650px; top: 120px; width: 470px; transform: rotate(-2.5deg); }
</style>
</head>
<body>
<main class="canvas">
  <div class="copy">
    <span class="brand" data-fit>
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 3.5v25" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M9.5 5h17.5v13H9.5z" fill="#f2c230"/><path d="M5 28.5h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Berth<b>IQ</b></span>
    </span>
    <div><span class="case" data-fit>CASE STUDY</span></div>
    <h1 data-fit>43 hours at anchor.<br /><em>A berth that fit<br />stood idle.</em></h1>
    <div class="stats" data-fit>
      <div><strong>43 h</strong><span>at anchor</span></div>
      <div><strong>3×</strong><span>documents<br />returned</span></div>
      <div><strong class="sim">−28%</strong><span>simulated<br />wait</span></div>
    </div>
    <p class="byline" data-fit>Product, design &amp; engineering — Abdul &amp; Shravani</p>
  </div>
  <figure class="shot window harbor"><img src="crops/harbor-0592.webp" alt="" /></figure>
  <figure class="shot why"><img src="crops/why.webp" alt="" /></figure>
  <p class="footline" data-fit>Synthetic operations on real port geography · map © OpenStreetMap</p>
</main>
</body>
</html>
