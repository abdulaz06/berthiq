name: CI

# CI is the reviewer (docs/WORKFLOW.md §4). Tools are called DIRECTLY here —
# `just` is a developer convenience, never a CI dependency.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    # Fail fast: a hung step (network, apt, a wedged test) errors in minutes
    # instead of occupying a runner for GitHub's 6-hour default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # A throwaway Postgres for the M0-2 migration + ORM round-trip tests. The
    # schema uses UUID/JSONB/native enums, so a real Postgres (not SQLite) is
    # required; tests read this via DATABASE_URL (same source as Alembic env.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: berthiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/berthiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (with dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy app
      - name: pytest
        run: pytest -q

  frontend:
    name: frontend (eslint · tsc · vitest · provenance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: eslint
        run: npm run lint
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm run test
      # Provenance lint (CLAUDE.md rule #3): no KPI reaches the screen without
      # <ProvenanceBadge>. The rule's own "does it fire?" proof runs inside vitest
      # above (scripts/check-provenance.test.mjs); this scans the real app.
      - name: provenance check
        run: npm run check:provenance

  e2e:
    name: e2e (playwright placeholder)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # Cache the Chromium download (~120MB) keyed on the Playwright version, so
      # only the first run per version pays the download. This is what turned a
      # ~5-minute step (and, when the mirror hung, a 26-minute stall) into seconds.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      # Step-level timeout so a wedged download/apt fails in 8 min, not 15+.
      # On a cache hit the browser is already present, so this only installs OS
      # deps and returns quickly; on a miss it downloads then populates the cache.
      - name: Install Playwright browser (+ OS deps)
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke (loads the app in fixtures mode)
        run: npm run e2e
