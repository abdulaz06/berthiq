[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "berthiq-backend"
version = "0.1.0"
description = "BerthIQ backend — FastAPI modular monolith for maritime port-call operations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "psycopg2-binary>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.29",
    "ruff>=0.8,<0.12",
    "mypy>=1.13,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
# Sensible, not fussy: pyflakes, pycodestyle, isort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# 'app' is imported as a top-level package (editable install / pytest pythonpath).
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
# Lets `pytest` find the `app` package when run from the backend/ directory,
# even without the editable install.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
