[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "berthiq-backend"
version = "0.1.0"
description = "BerthIQ backend — FastAPI modular monolith for maritime port-call operations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<0.163",
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.32,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "psycopg2-binary>=2.9,<3",
    # Process discovery (M1-04): DFG + trace variants. AGPL v3 — acceptable for
    # public deployment requires the source/license disclosure in DOCS/DEPLOYMENT.md.
    "pm4py>=2.7,<3",
    # Risk model (M1-06). scikit-learn is pinned to a minor so CI reproduces the
    # local metrics exactly (the main-beats-baseline margin is deterministic given
    # a fixed version + seed). shap provides per-case attributions.
    "scikit-learn==1.9.0",
    "shap>=0.51,<0.52",
    "joblib>=1.3,<2",
    "numpy>=2,<3",
    "pandas>=2,<4",
    "ortools>=9.14,<10",
    "simpy>=4.1,<5",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "httpx>=0.27,<0.29",
    "pip-audit>=2.10,<3",
    "ruff>=0.8,<0.12",
    "mypy>=1.13,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
# Sensible, not fussy: pyflakes, pycodestyle, isort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# 'app' is imported as a top-level package (editable install / pytest pythonpath).
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
# Lets `pytest` find the `app` package when run from the backend/ directory,
# even without the editable install.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
